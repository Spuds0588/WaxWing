name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Mobile-viewport E2E (portrait Android/iOS + landscape)
        run: bunx playwright test
